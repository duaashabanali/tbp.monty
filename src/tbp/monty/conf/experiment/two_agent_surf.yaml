# @package _global_

# This experiment runs TWO independent Monty agents perceiving the same
# Habitat scene at once -- the basis for the Theory of Mind work described in
# MULTI_AGENT.md. Each agent has its own sensors, learning module, and motor
# policy, and they share one environment, stepping together each episode.
#
# Like the single-agent tutorial config, this file is composed entirely from
# reusable /monty/... defaults -- no interpolation, no YAML anchors. The one
# difference from a single-agent experiment: MultiAgentMontyExperiment
# expects a *dict* of per-agent Monty configs (`agent_monty_configs`), one
# entry per physical agent, instead of a single `monty_config`. Each default
# below is package-renamed (`@`) to land directly inside one agent's slot
# (`experiment.config.agent_monty_configs.<agent>.monty_config...`), the same
# way the tutorial's defaults compose directly into `monty_config` -- just
# with an explicit target instead of the implicit default one. /environment
# similarly supplies both physical agents' sensor rigs and transforms in one
# file, since a Habitat env is a single object shared by both agents, not
# something that's naturally split per-agent.

defaults:
  # ---------------------------------------------------------------- Agent 0
  # /monty defines what Monty we will use (evidence-based graph matching)
  # and how many exploration/eval/train/total steps to configure it with.
  - /monty@experiment.config.agent_monty_configs.agent0.monty_config: evidencegraph_exp1000_emin_t3_tot2500
  # /monty/sensor_module is Monty's sensor module configuration: a CameraSM
  # reading the `patch` sensor and a Probe reading the `view_finder` sensor.
  - /monty/sensor_module@experiment.config.agent_monty_configs.agent0.monty_config.sensor_module_configs: camera_surf_noise_raw1
  # /monty/learning_module is Monty's learning module configuration: a
  # single EvidenceGraphLM learning module.
  - /monty/learning_module@experiment.config.agent_monty_configs.agent0.monty_config.learning_module_configs: two_surf_agents_evidence
  # /monty/connectivity connects one sensor module to one learning module,
  # scoped to Agent 0's physical agent (`agent_id_0`).
  - /monty/connectivity@experiment.config.agent_monty_configs.agent0.monty_config: 1lm_1sm

  # ---------------------------------------------------------------- Agent 1
  # Same composition as Agent 0 above, package-renamed into Agent 1's own
  # slot. /monty, /monty/sensor_module, and /monty/learning_module reuse the
  # exact same files as Agent 0, since those pieces are configured
  # identically for both agents; /monty/connectivity uses an
  # Agent-1-specific variant (`agent_id_1`).
  - /monty@experiment.config.agent_monty_configs.agent1.monty_config: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/sensor_module@experiment.config.agent_monty_configs.agent1.monty_config.sensor_module_configs: camera_surf_noise_raw1
  - /monty/learning_module@experiment.config.agent_monty_configs.agent1.monty_config.learning_module_configs: two_surf_agents_evidence
  - /monty/connectivity@experiment.config.agent_monty_configs.agent1.monty_config: 1lm_1sm_agent1

  # /monty/motor_system_config supplies the motor policy for BOTH agents in
  # one file (unlike the pieces above, which need one default entry per
  # agent) -- its own content already has `agent0`/`agent1` keys, so no
  # @-rename is needed here; it merges into the same agent_monty_configs
  # tree the other defaults above build via @-rename.
  - /monty/motor_system_config: two_surf_agents

  # /environment specifies the shared Habitat scene: the object placed in it,
  # both physical agents (sensors + starting pose), and their transforms.
  - /environment: two_surf_agents_habitat

  # /env_interface specifies how to set up the environment for the experiment.
  # We evaluate (no training) on 10 distinct objects, placed with random
  # rotations, and both agents use a surface-following policy ("2surf").
  - /env_interface: eval_distinctobj_random_2surf

  # /logging specifies the logging configuration to use. We tell Monty to use
  # the DETAILED data logging mode and Python to use the DEBUG log level, so
  # we can inspect every step while debugging the two-agent setup.
  - /logging: detailed_debug_monty_runs

experiment:
  # The top-level _target_ is what kind of experiment we want to run.
  # MultiAgentMontyExperiment steps a dict of independent MontyBase
  # instances (one per physical agent) against the same shared environment
  # each episode.
  _target_: tbp.monty.frameworks.experiments.multi_agent_experiment.MultiAgentMontyExperiment
  # config specifies the configuration of the experiment itself.
  config:
    # `show_sensor_output: true` will display a live plot of each agent's
    # `patch` sensor output.
    show_sensor_output: false
    # The maximum number of steps to train for. Unused here since do_train
    # is false.
    max_train_steps: 10
    # The maximum number of steps to evaluate for, per episode.
    max_eval_steps: 2500
    # The maximum number of steps to run for, across all agents combined.
    max_total_steps: 2500
    # The number of epochs to train for. Unused here since do_train is false.
    n_train_epochs: 3
    # The number of epochs to evaluate for. One epoch cycles through every
    # object listed in the env_interface's `object_names`.
    n_eval_epochs: 10
    min_lms_match: 1
    # The random seed for the experiment.
    seed: 42
    # No learning modules are supervised here -- both agents load pretrained
    # models instead (see `model_name_or_path` inside `agent_monty_configs`).
    supervised_lm_ids: []
    # Unused at this top level; each agent specifies its own
    # `model_name_or_path` inside `agent_monty_configs`.
    model_name_or_path: null
    do_train: false
    do_eval: true

    # One entry per physical agent. `monty_config` for each is fully
    # supplied by the /monty/... defaults above (package-renamed into each
    # agent's slot); the only thing that doesn't come from a /monty/...
    # default is `model_name_or_path`, since it's specific to this
    # experiment rather than a general Monty setting.
    agent_monty_configs:
      agent0:
        # Path to the pretrained object model this agent's learning module
        # loads at startup (both agents share the same pretrained checkpoint).
        model_name_or_path: ${constants.pretrained_dir}/surf_agent_1lm_10distinctobj/pretrained/
      agent1:
        # (Per MULTI_AGENT.md, only Agent 0's metrics currently reach the
        # WandB/CSV logger -- Agent 1 runs and is checkpointed separately,
        # but isn't logged per-step yet.)
        model_name_or_path: ${constants.pretrained_dir}/surf_agent_1lm_10distinctobj/pretrained/

    logging:
      # Every experiment has a unique run name. This is used to identify the
      # experiment in the logs and to save trained models.
      run_name: two_agent_surf
      # Override the /logging default's monty_handlers: swap
      # BasicCSVStatsHandler (which only understands a single agent's LM_*
      # stats) for MultiAgentCSVStatsHandler, which writes one row per
      # (agent, learning module) -- required for this experiment's two
      # agents to both show up in eval_stats.csv / train_stats.csv.
      monty_handlers:
        - ${monty.class:tbp.monty.frameworks.loggers.monty_handlers.MultiAgentCSVStatsHandler}
        - ${monty.class:tbp.monty.frameworks.loggers.monty_handlers.DetailedJSONHandler}
